<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

   CHROME — the picker UI around the designs. Not part of any design.
   ============================================================ */
* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

  background: #0b0e11;

#chrome {
  position: sticky;
  top: 0;
  z-index: 100;

  backdrop-filter: saturate(140%) blur(14px);
  border-bottom: 1px solid #22282f;
}

.chrome-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 10px 20px;
}

.chrome-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 9px;
}

.chrome-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: #7d8b99;
  white-space: nowrap;
}

.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 1px;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  color: #9aa8b5;
  background: #161b21;
  border: 1px solid #262d35;
  border-radius: 7px;
  padding: 6px 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 7px;
  transition: all .12s;
  white-space: nowrap;
}

.tab:hover { color: #e7ecf1; border-color: #3a444f; }

.tab[aria-selected="true"] {
  background: #e7ecf1;
  color: #0b0e11;
  border-color: #e7ecf1;
}

.tab .n {
  font-size: 11px;
  font-weight: 700;
  opacity: .55;
  font-variant-numeric: tabular-nums;
}

.widths { display: flex; gap: 4px; }

.wbtn {

  font-size: 12px;
  color: #9aa8b5;
  background: #161b21;
  border: 1px solid #262d35;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
}

.wbtn[aria-pressed="true"] { background: #e7ecf1; color: #0b0e11; border-color: #e7ecf1; }

#meta {
  max-width: 1180px;
  margin: 0 auto;
  padding: 16px 20px 10px;
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}

#meta h2 {
  margin: 0;
  font-size: 17px;
  letter-spacing: -0.02em;
  font-weight: 600;
  white-space: nowrap;
}

#meta p {
  margin: 0;
  color: #8b98a6;
  font-size: 13.5px;
  line-height: 1.5;
  flex: 1;
  min-width: 280px;

#frame-wrap {

  margin: 0 auto;
  padding: 4px 20px 40px;
}

#frame {

  max-width: 100%;
  height: 780px;
  border: 1px solid #262d35;
  border-radius: 12px;
  background: #fff;

  margin: 0 auto;

  margin: 0 auto;
  padding: 0 20px 40px;
  color: #6d7a88;
  font-size: 13px;

<body>

<p class="hint">
  Use <kbd>←</kbd> <kbd>→</kbd> to flip through. Each design is fully live — type in the fields,

  <code>index.html</code> as the real page.

<script>
/* ============================================================
   Shared form model — every design renders the same six Default fields.
   ============================================================ */
const FIELDS = [
  { name: "first_name",     label: "First name",   type: "text",  half: true,  ac: "given-name" },
  { name: "last_name",      label: "Last name",    type: "text",  half: true,  ac: "family-name" },
  { name: "email",          label: "Work email",   type: "email", ac: "email" },
  { name: "company_name",   label: "Practice / organization", type: "text", ac: "organization" },
  { name: "job_title",      label: "Job title",    type: "text",  ac: "organization-title" },
  { name: "provider_count", label: "How many providers are in your practice?", type: "select",
    options: [["", "Select one"], ["1-30", "1–30 providers"], ["31+", "31+ providers"]] },
];

function fields(opts = {}) {
  const { floating = false, placeholders = false, noLabels = false } = opts;
  let html = "";
  let i = 0;

  while (i < FIELDS.length) {
    const f = FIELDS[i];

    if (f.half && FIELDS[i + 1] && FIELDS[i + 1].half) {
      html += `<div class="row">${field(FIELDS[i], opts)}${field(FIELDS[i + 1], opts)}</div>`;
      i += 2;
    } else {
      html += field(f, opts);
      i += 1;
    }
  }
  return html;
}

function field(f, { floating, placeholders, noLabels }) {
  const id = "f-" + f.name;
  const ph = placeholders ? ` placeholder="${f.label}"` : (floating ? ' placeholder=" "' : "");
  const label = noLabels ? "" : `<label for="${id}">${f.label}</label>`;

  let control;
  if (f.type === "select") {
    control =
      `<select id="${id}" name="${f.name}" required>` +
      f.options.map(([v, t], k) =>
        `<option value="${v}"${v === "" ? " disabled selected" : ""}>${t}</option>`).join("") +
      `</select>`;
  } else {
    control = `<input type="${f.type}" id="${id}" name="${f.name}"` +
      ` autocomplete="${f.ac || "off"}"${ph} required>`;
  }

  // Floating-label variants need the control before the label in the DOM.
  const inner = floating ? control + label : label + control;
  return `<div class="field${f.half ? " half" : ""}${floating ? " float" : ""}">${inner}</div>`;
}

const NOTE = "20 minutes. A working demo on your own workflows — no pitch deck.";

/* ============================================================

  html: `<style>${RESET}

input,select{width:100%;padding:12px 13px;font-size:15px;background:#fafbfc;border:1px solid #dfe5ea;border-radius:10px;outline:none;transition:.13s}
select{background-image:${CHEV("#5a6b78")};background-repeat:no-repeat;background-position:right 13px center;padding-right:36px}
input:focus,select:focus{background:#fff;border-color:#0f8b8d;box-shadow:0 0 0 3px rgba(15,139,141,.14)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:15px;border:1.5px solid #dfe5ea;border-radius:12px;cursor:pointer;transition:.13s;background:#fff}
.opt:hover{border-color:#a8d4d4;background:#f7fcfc}
.opt input{width:17px;height:17px;flex:none;accent-color:#0f8b8d;padding:0}

.nav{display:flex;gap:10px;margin-top:22px;align-items:center}
button{padding:13px 22px;font-size:15px;font-weight:600;border:0;border-radius:10px;cursor:pointer;transition:.13s}

<div class="shell">

<script>
  const panes = [...document.querySelectorAll(".pane")];
  const bar = document.getElementById("bar");

  function go(step) {
    panes.forEach(p => p.classList.toggle("on", p.dataset.step === step));
    bar.style.width = (step / 3 * 100) + "%";
  }

  document.querySelectorAll("[data-to]").forEach(b => {
    b.addEventListener("click", () => {
      const forward = b.classList.contains("next");
      if (forward) {
        const cur = b.closest(".pane");
        const bad = [...cur.querySelectorAll("input,select")].find(i => !i.checkValidity());
        if (bad) { bad.reportValidity(); return; }
      }
      go(b.dataset.to);
    });
  });

  document.getElementById("sf").addEventListener("submit", e => e.preventDefault());

/* ============================================================
   Picker wiring
   ============================================================ */
const tabsEl  = document.getElementById("tabs");
const frame   = document.getElementById("frame");
const nameEl  = document.getElementById("meta-name");
const blurbEl = document.getElementById("meta-blurb");
let current = 0;
const BASE_H = 780;

DESIGNS.forEach((d, i) => {
  const b = document.createElement("button");
  b.className = "tab";
  b.setAttribute("role", "tab");
  b.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")}</span>${d.short}`;
  b.addEventListener("click", () => show(i));
  tabsEl.appendChild(b);
});

function show(i) {
  current = i;
  const d = DESIGNS[i];

  nameEl.textContent = d.name;
  blurbEl.textContent = d.blurb;

  [...tabsEl.children].forEach((t, k) =>
    t.setAttribute("aria-selected", k === i ? "true" : "false"));

  // Reset to the baseline first. Several designs use min-height:100vh, so the
  // frame's own height feeds back into their content height — without this,
  // each switch would ratchet the frame taller.
  frame.style.height = BASE_H + "px";

  frame.srcdoc =
    `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">` +
    `<meta name="viewport" content="width=device-width,initial-scale=1">${FONTS}</head>` +
    `<body>${d.html}</body></html>`;
}

// Fit the frame to each design instead of one fixed height, so short pages
// don't sit in a pool of dead space and the tall one still scrolls.
function fit() {
  const doc = frame.contentDocument;
  if (!doc || !doc.body) return;
  const h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
  frame.style.height = Math.min(Math.max(h, BASE_H), 1700) + "px";
}

frame.addEventListener("load", () => {
  fit();
  // Webfonts land after load and change the height.
  const d = frame.contentDocument;
  if (d && d.fonts) d.fonts.ready.then(fit);
  setTimeout(fit, 400);
});

document.querySelectorAll(".wbtn").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".wbtn").forEach(x =>
      x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    frame.className = b.dataset.w === "desktop" ? "" : "w-" + b.dataset.w;
  });
});

addEventListener("keydown", e => {
  if (e.key === "ArrowRight") show((current + 1) % DESIGNS.length);
  if (e.key === "ArrowLeft")  show((current - 1 + DESIGNS.length) % DESIGNS.length);
});

show(0);
</script>
